name: Sync upstream core

# 定期自动同步上游核心：把 submodule 指针（upstream/）更新到上游 main 最新，
# 推到 main 后自动触发 tvOS 构建发布（build.yml）。
# 有更新时还会自动递增 VERSION 并在 CHANGELOG 补一节，确保每次同步都能发布新 Release。
# 若上游无更新，不做任何事；若构建失败，GitHub 会发失败通知，届时可手动回退指针。
#
# 注意：本工作流依赖 submodule 转换已落地（upstream/ 已是 submodule）。
# 若 submodule 尚未落地，本工作流会失败。

on:
  schedule:
    # 每隔天 03:17 UTC（北京时间 11:17）检查一次上游（按当月奇数日触发；月底 31 日→次月 1 日会连着两天，无碍）。
    - cron: '17 3 */2 * *'
  workflow_dispatch:  # 手动触发，便于立即测试

permissions:
  contents: write  # 提交并推送 submodule 指针更新
  actions: write   # 触发 tvOS 构建工作流

concurrency:
  group: sync-upstream-core
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 更新 submodule 到上游最新 main
        id: update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git submodule update --remote -- upstream
          if git diff --quiet -- upstream; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游核心无更新，指针已是最新。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "上游核心有更新："
            git -C upstream log --oneline -5
          fi
      - name: 自动提升版本号并补更新日志
        id: bump
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          NEW_COMMIT="$(git -C upstream rev-parse --short HEAD)"
          NEW_SUBJECT="$(git -C upstream log -1 --format=%s)"
          export NEW_COMMIT NEW_SUBJECT
          python3 - <<'PYEOF'
          import os
          raw = open('VERSION').read()
          ver = raw.strip()
          head, dot, tail = ver.rpartition('.')
          assert dot and tail.isdigit(), f'VERSION 格式无法递增: {ver!r}'
          new_ver = f'{head}.{int(tail) + 1}'
          open('VERSION', 'w').write(new_ver + ('\n' if raw.endswith('\n') else ''))
          # 关于页版本与根 VERSION 统一：工程里的 MARKETING_VERSION 也同步，
          # 否则下次发版后 Xcode 直接构建又会显示旧版本。
          import re
          pbx = 'tvos/GuoAppTV/GuoAppTV.xcodeproj/project.pbxproj'
          text = open(pbx).read()
          text2, n = re.subn(r'MARKETING_VERSION = [^;]+;',
                             f'MARKETING_VERSION = {new_ver};', text)
          assert n > 0, 'pbxproj 里没有 MARKETING_VERSION'
          open(pbx, 'w').write(text2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={new_ver}\n')
          section = (f'## {new_ver}\n\n'
                     f'- 同步上游核心到 Xanerix/guoapp `{os.environ["NEW_COMMIT"]}`'
                     f'（{os.environ["NEW_SUBJECT"]}）。本次仅更新 Go 核心'
                     f'（submodule 指针），tvOS 应用代码无改动。\n\n')
          lines = open('CHANGELOG.md').read().splitlines(keepends=True)
          idx = next((i for i, ln in enumerate(lines)
                      if ln.startswith('## ') and '未发布' not in ln), len(lines))
          lines[idx:idx] = [section]
          open('CHANGELOG.md', 'w').write(''.join(lines))
          print(f'VERSION -> {new_ver}，CHANGELOG 已补一节，pbxproj MARKETING_VERSION 已同步')
          PYEOF
      - name: 提交并推送（指针 + 版本 + 更新日志）
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          NEW_COMMIT="$(git -C upstream rev-parse HEAD)"
          NEW_SUBJECT="$(git -C upstream log -1 --format=%s)"
          git add upstream VERSION CHANGELOG.md tvos/GuoAppTV/GuoAppTV.xcodeproj/project.pbxproj
          git commit -m "同步上游核心到 ${NEW_COMMIT:0:7}（${NEW_SUBJECT}），版本升至 ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
      - name: 触发 tvOS 构建发布
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref main
